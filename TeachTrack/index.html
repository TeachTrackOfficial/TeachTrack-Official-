<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeachTrack | Login</title>

    <link rel="stylesheet" href="css/style.css">

    <script type="module" src="js/auth.js"></script>
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-brand">
            <div class="school-logo"><img src="assets/srnts-logo.png" alt="San Rafael National Trade School logo"></div>

            <h1>TeachTrack</h1>

            <p>
                Digital Teacher Availability<br>
                Tracking System
            </p>

            <span>Senior High School</span>
        </div>

        <div class="login-card">

            <h2>Welcome Back</h2>
            <p class="login-subtitle">
                Sign in to access TeachTrack
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label>Username</label>
                    <input
                        type="text"
                        id="email"
                        placeholder="Enter your TeachTrack username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
<button type="button" class="tt-password-toggle" data-password-target="password" aria-pressed="false">Show password</button>
                </div>

                <button type="submit" class="primary-btn">
                    Sign In
                </button>

                <p id="loginMessage" class="message"></p>

            </form>
           
<p style="text-align:center;margin-top:16px">
  <button type="button" id="showRegister" class="primary-btn" style="width:100%;background:#800020;color:#ffffff;border:2px solid #800020;padding:14px;border-radius:10px;font-weight:bold;cursor:pointer;">
    Create Teacher Account
  </button>
</p>

            <form id="registerForm" hidden style="margin-top:18px">
              <h2>Create Teacher Account</h2>
              <p class="login-subtitle">Use your real school email and a new password just for TeachTrack. Registration requires school approval.</p>
              <div class="input-group"><label for="regName">Full Name</label><input id="regName" maxlength="100" autocomplete="name" required></div>
              <div class="input-group"><label for="regEmail">School Email</label><input id="regEmail" type="email" autocomplete="email" required></div>
              <div class="input-group"><label for="regPassword">New TeachTrack Password</label><input id="regPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<button type="button" class="tt-password-toggle" data-password-target="regPassword" aria-pressed="false">Show password</button></div>
              <div class="input-group"><label for="regConfirm">Confirm Password</label><input id="regConfirm" type="password" minlength="12" autocomplete="new-password" required>
<button type="button" class="tt-password-toggle" data-password-target="regConfirm" aria-pressed="false">Show password</button></div>
              <button type="submit" class="primary-btn">Submit Registration</button>
              <p id="registerMessage" class="message" role="status" aria-live="polite"></p>
              <button type="button" id="backToLogin" style="margin-top:12px">Back to Sign In</button>
            </form>
        </div>

    </div>

<script>
document.querySelectorAll('[data-password-target]').forEach(button => {
  button.addEventListener('click', () => {
    const field = document.getElementById(button.dataset.passwordTarget);
    if (!field) return;
    const showing = field.type === 'password';
    field.type = showing ? 'text' : 'password';
    button.textContent = showing ? 'Hide password' : 'Show password';
    button.setAttribute('aria-pressed', String(showing));
  });
});
</script>
</body>
</html>
